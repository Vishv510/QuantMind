spring:
  application:
    name: auth-service

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:stock_auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  flyway:
    enabled: false

  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:admin123}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/auth

logging:
  level:
    root: INFO
    com.stock: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${APP_JWT_SECRET:this-is-a-very-long-development-jwt-secret-key-1234567890}
    expiration: ${APP_JWT_EXPIRATION:86400000}
